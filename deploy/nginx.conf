server {
    listen 80;
    server_name _;

    root /var/www/hms;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to FastAPI backend.
    # `^~` makes this a "stop here" prefix match — without it, nginx still falls
    # through to the regex location below for any /api/... path ending in an
    # image/asset extension (e.g. /api/v1/uploads/hospital/logo.jpg), since
    # regex locations take priority over plain prefix locations. That caused
    # uploaded logos/avatars to 404 (nginx tried serving them from the SPA's
    # static root instead of proxying to the backend).
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_set_header   Connection        "";
    }

    # Cache static files (frontend's own built assets only — /api/ is excluded above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
