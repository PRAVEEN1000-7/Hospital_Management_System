server {
    listen 80;
    server_name _;

    root /var/www/hms;
    index index.html;

    # Security headers (SECURITY_AUDIT.md) — these can only be delivered as
    # real HTTP headers, not via a <meta> tag, which is why they live here
    # rather than in index.html (which carries the CSP instead). nginx does
    # NOT inherit add_header from this block into a location that defines
    # its own add_header (see the static-asset location below) — repeated
    # there for that reason.
    # HSTS is a no-op until this is actually served over HTTPS — browsers
    # ignore Strict-Transport-Security received over plain HTTP — included
    # now so it takes effect automatically once TLS is enabled.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to FastAPI backend.
    # `^~` makes this a "stop here" prefix match — without it, nginx still falls
    # through to the regex location below for any /api/... path ending in an
    # image/asset extension (e.g. /api/v1/uploads/hospital/logo.jpg), since
    # regex locations take priority over plain prefix locations. That caused
    # uploaded logos/avatars to 404 (nginx tried serving them from the SPA's
    # static root instead of proxying to the backend).
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_set_header   Connection        "";
    }

    # Cache static files (frontend's own built assets only — /api/ is excluded above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated — see note on the server-level add_header block above.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
